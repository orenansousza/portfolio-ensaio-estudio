<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfólio Estúdio — Rafael Renan</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--b:#087BFF;--r:#0033CC;--soft:#eef4ff;--line:#d6e2fb;--mut:#4b5568;--disp:"Bricolage Grotesque","Arial Black",Arial,sans-serif;--sans:"Manrope",Arial,sans-serif}*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:#fff;color:#000}
header{text-align:center;padding:clamp(48px,9vw,96px) 22px clamp(24px,4vw,40px);background:linear-gradient(160deg,var(--r),#001a66);color:#fff}
header small{display:block;font:700 13px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:#cfe3ff;margin-bottom:12px}
h1{font:800 clamp(38px,8vw,76px)/1 var(--disp);letter-spacing:-.045em}
.g{max-width:720px;margin:0 auto;padding:clamp(24px,4vw,48px) 16px 64px;display:grid;gap:16px}
.pi{border:0;padding:0;background:var(--soft);border-radius:18px;overflow:hidden;cursor:zoom-in;box-shadow:0 14px 40px rgba(0,51,204,.16);min-height:240px}
.pi img{width:100%;height:auto;display:block}
dialog{border:0;background:transparent;max-width:100vw;max-height:100vh;padding:0;margin:auto}dialog::backdrop{background:rgba(0,0,0,.88)}
dialog img{max-width:96vw;max-height:94vh;display:block;border-radius:10px}
</style></head><body>
<header><small>Ensaio estúdio</small><h1>Portfólio</h1></header>
<main class="g">
<button class="pi" aria-label="Ampliar foto 1"><img loading="lazy" alt="Foto 1" src="https://i.postimg.cc/2yKKXhbn/MG-9320.jpg"></button>
<button class="pi" aria-label="Ampliar foto 2"><img loading="lazy" alt="Foto 2" src="https://i.postimg.cc/bvhFMzJ0/MG-9374.jpg"></button>
<button class="pi" aria-label="Ampliar foto 3"><img loading="lazy" alt="Foto 3" src="https://i.postimg.cc/3NdLpNSQ/MG-9277-2.jpg"></button>
<button class="pi" aria-label="Ampliar foto 4"><img loading="lazy" alt="Foto 4" src="https://i.postimg.cc/dQbXdmFq/MG-9157-2.jpg"></button>
<button class="pi" aria-label="Ampliar foto 5"><img loading="lazy" alt="Foto 5" src="https://i.postimg.cc/Zqssq6HN/MG-9120-2.jpg"></button>
<button class="pi" aria-label="Ampliar foto 6"><img loading="lazy" alt="Foto 6" src="https://i.postimg.cc/hP0rj9Ps/MG-9090-2.jpg"></button>
<button class="pi" aria-label="Ampliar foto 7"><img loading="lazy" alt="Foto 7" src="https://i.postimg.cc/hGXbp68M/MG-9118-2.jpg"></button>
<button class="pi" aria-label="Ampliar foto 8"><img loading="lazy" alt="Foto 8" src="https://i.postimg.cc/WzvGp4BX/MG-9194-2.jpg"></button>
<button class="pi" aria-label="Ampliar foto 9"><img loading="lazy" alt="Foto 9" src="https://i.postimg.cc/L4G96rh5/Foto-4.jpg"></button>
<button class="pi" aria-label="Ampliar foto 10"><img loading="lazy" alt="Foto 10" src="https://i.postimg.cc/xjXjQ0f4/Foto-3.jpg"></button>
<button class="pi" aria-label="Ampliar foto 11"><img loading="lazy" alt="Foto 11" src="https://i.postimg.cc/3xh8Gbbb/MG-8709-2.jpg"></button>
</main>
<dialog id="m"><img id="big" alt=""></dialog>
<script>
const m=document.getElementById("m"),big=document.getElementById("big");
document.querySelectorAll(".pi").forEach(b=>b.onclick=()=>{big.src=b.firstElementChild.src;m.showModal()});
m.onclick=()=>m.close();
</script></body></html>
